version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: uiem_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword123
      MYSQL_DATABASE: plataforma_uiem
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - uiem_network

  backend:
    build: ./backend
    container_name: uiem_backend
    restart: always
    ports:
      - "3001:3000"
    environment:
      - DB_HOST=db
      - DB_USER=root
      - DB_PASSWORD=rootpassword123
      - DB_NAME=plataforma_uiem
      - DB_PORT=3306
      - JWT_SECRET=uiem_clave_secreta_2026_super_segura
      - PORT=3000
      - FRONTEND_URL=http://172.16.100.30:8080
    depends_on:
      - db
    volumes:
      - backend_uploads:/app/uploads
    networks:
      - uiem_network

  frontend:
    build: ./frontend
    container_name: uiem_frontend
    restart: always
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - uiem_network

volumes:
  db_data:
  backend_uploads:

networks:
  uiem_network:
    driver: bridge